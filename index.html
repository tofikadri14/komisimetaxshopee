const prs=k=>{const t=new Date(),d=(n)=>iso(new Date(t.getFullYear(),t.getMonth(),t.getDate()-n));if(k===1){S.set.a1=iso(new Date(t.getFullYear(),t.getMonth(),1));S.set.a2=iso(t);S.set.b1=iso(new Date(t.getFullYear(),t.getMonth()-1,1));S.set.b2=iso(new Date(t.getFullYear(),t.getMonth(),0))}else{S.set.a1=d(6);S.set.a2=d(0);S.set.b1=d(13);S.set.b2=d(7)}sv();render()};

 return[['Baris terbaca',R.length],['Baris dilewati/kosong',S.skipped],['Pesanan unik',O.length],['ID pesanan kosong',R.filter(r=>!r.id).length],['Baris duplikat persis',dup],['Pesanan dengan status berbeda antarbaris',O.filter(o=>o.fl.some(f=>f.startsWith('Status'))).length],['Pesanan dengan total komisi bervariasi antarbaris',O.filter(o=>o.fl.some(f=>f.startsWith('Total'))).length],['Komisi bersih kosong',R.filter(r=>r.net==null).length],['Komisi bersih negatif',R.filter(r=>r.net<0).length],['Nilai pembelian nol',R.filter(r=>r.buy===0).length],['Waktu pemesanan tidak valid',R.filter(r=>!r.tO).length],['Waktu terselesaikan kosong/tidak valid',R.filter(r=>!r.tD).length],['Pesanan komisi bersih ≠ total',O.filter(o=>o.anom).length],['Status tidak dikenal (Lainnya)',O.filter(o=>o.sc==='lain').length],['Pesanan data tidak lengkap',O.filter(o=>o.inc).length]]}

 ${S.raw.length?`${miss.length?`<div class="nt er">Kolom wajib belum terpetakan: ${miss.map(k=>FL[k]).join(', ')}. Petakan manual di bawah.</div>`:''}<div class=cd><h3>Pemetaan kolom — ${esc(S.file)}</h3><div class=fb>${Object.keys(F).map(k=>`<label>${FL[k]}<select onchange="S.map['${k}']=this.value;build();render()"><option value="">(tidak ada)</option>${S.hdr.map(h=>`<option ${S.map[k]===h?'selected':''}>${esc(h)}</option>`).join('')}</select></label>`).join('')}</div></div>

function lf(file){if(!file)return;if(typeof Papa==='undefined'){toast('Papa Parse tidak termuat');return}
 Papa.parse(file,{header:true,skipEmptyLines:'greedy',delimitersToGuess:[',',';','\t','|'],transformHeader:h=>h.replace(/^\uFEFF/,'').trim(),complete:res=>{
  const hdr=res.meta.fields||[];let rows=res.data;if(!hdr.length||!rows.length){toast('File kosong atau bukan CSV yang valid');return}
  const mode=($('#im')||{}).value||'r',had=S.raw.length;let add=rows.length,dupN=0;
  if(had&&mode!=='r'){if(mode==='d'){const ks=new Set(S.raw.map(r=>JSON.stringify(hdr.map(h=>r[h]))));rows=rows.filter(r=>{const dp=ks.has(JSON.stringify(hdr.map(h=>r[h])));if(dp)dupN++;return!dp});add=rows.length}
   if(!confirm(`Gabungkan: ${add} baris baru ditambahkan ke ${S.raw.length} baris aktif${mode==='d'?` (${dupN} baris duplikat persis dilewati)`:' (tanpa cek duplikasi)'}. Lanjutkan?`))return;S.raw=S.raw.concat(rows)}
  else{S.raw=rows;S.hdr=hdr}
  if(!S.hdr.length||mode==='r'||!had)S.hdr=hdr;S.file=file.name;S.skipped=(res.errors||[]).length;automap();build();
  S.hist.unshift({name:file.name,t:new Date().toLocaleString('id-ID',{timeZone:'Asia/Jakarta'}),rows:add,mode:had?(mode==='d'?'tambah+cek duplikasi':mode==='m'?'gabung':'ganti'):'ganti'});S.hist=S.hist.slice(0,30);sv();
  toast(`${fn(add)} baris dibaca, ${S.skipped} dilewati`);S.pg=S.orders.length?'dash':'imp';render()},error:e=>toast('Gagal membaca file: '+e.message)})}
